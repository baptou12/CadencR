[package]
name = "tauri-plugin-notification-router"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
links = "tauri-plugin-notification-router"

[dependencies]
tauri = "2"
tauri-plugin = "2"
serde = { version = "1", features = ["derive"] }
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSDictionary", "NSString", "NSObject", "NSSet", "NSArray"] }
objc2-user-notifications = { version = "0.3", features = ["default"] }
block2 = "0.6"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
