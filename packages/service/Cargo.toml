[package]
name = "cadence-service"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
axum = { version = "0.8", features = ["ws"] }
claude-agent-sdk-rs = { path = "../claude-agent-sdk-rs" }
cli-discovery = { path = "../cli-discovery" }
opencode-sdk-rs = { path = "../opencode-sdk-rs" }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
regex-lite = "0.1"
dirs = "6"
rand = "0.8"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
rmcp = { version = "1", features = ["server", "transport-streamable-http-server", "transport-io"] }
dashmap = "6"
libc = "0.2"
portable-pty = "0.8"
ignore = "0.4"
nucleo-matcher = "0.3"
notify-debouncer-mini = "0.5"
dotenvy = "0.15"

[[bin]]
name = "dump-openapi"
path = "src/bin/dump_openapi.rs"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
assert-json-diff = "2"
tower = { version = "0.5", features = ["util"] }
