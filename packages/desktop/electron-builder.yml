appId: com.cadencr.desktop
productName: Cadencr
icon: icons/icon
directories:
  output: dist-electron
publish:
  - provider: github
    owner: merkr-software
    repo: cadencr
    releaseType: release
afterPack: build/after-pack.cjs
afterSign: build/notarize-app.cjs
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/bin/cadencr-service
    to: cadencr-service
mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  # We notarize with notarytool; electron-builder's legacy Gatekeeper precheck is intentionally disabled.
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  signIgnore:
    - Contents/Resources/cadencr-service$
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

dmg:
  sign: true
