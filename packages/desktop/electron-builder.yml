appId: com.cadencr.desktop
productName: Cadencr
icon: icons/icon
directories:
  output: dist-electron
publish:
  - provider: github
    owner: merkr-software
    repo: cadencr
    # Upload all multi-arch assets while the release is still mutable; the
    # workflow publishes it after electron-builder has finished.
    releaseType: draft
afterPack: build/after-pack.cjs
afterSign: build/notarize-app.cjs
files:
  - out/**/*
  # The built SPA ships once, as extraResources `renderer/` below. Excluding it
  # from the asar avoids a ~44 MB duplicate; the packaged window loads it from
  # `process.resourcesPath/renderer` (see `rendererLoadUrl`).
  - "!out/renderer/**"
  - package.json
extraResources:
  # Per-arch sidecar from `@cadencr/service build:macos-sidecars`; arch-checked
  # in `build/after-pack.cjs`.
  - from: resources/bin/${arch}/cadencr-service
    to: cadencr-service
  # The built SPA on the real filesystem — loaded directly by the packaged
  # window (the asar can't hold it, see above) and served over the remote
  # listener via `--renderer-dir` (the Rust sidecar can't read an asar).
  - from: out/renderer
    to: renderer
  # Universal AppKit addon from `electron/mac-native-addon.ts` (see `mac-window.ts`).
  - from: resources/native
    to: native
    filter: ["*.node"]
  # Linux window icon: BrowserWindow needs a real file path (see `app-icon.ts`).
  - from: icons/512x512.png
    to: icons/512x512.png
mac:
  # Spell out the arch: electron-builder's default drops it for x64. The zip
  # uses this name; the dmg has its own below.
  artifactName: ${productName}-${version}-${arch}-mac.${ext}
  category: public.app-category.developer-tools
  hardenedRuntime: true
  # We notarize with notarytool; electron-builder's legacy Gatekeeper precheck is intentionally disabled.
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  signIgnore:
    - Contents/Resources/cadencr-service$
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

linux:
  target:
    - AppImage
    - deb
    - rpm
  category: Development
  icon: icons/
  synopsis: Desktop shell for driving local AI coding agents
  executableName: cadencr

# `${arch}` expands per target: x86_64 (AppImage, rpm), amd64 (deb).
appImage:
  artifactName: Cadencr-${version}-${arch}.${ext}

# Distro packages. electron-updater uses the package identity emitted by
# electron-builder to download and install the matching DEB or RPM release.
# Dependency lists are pinned explicitly (rather than relying on
# electron-builder defaults) so a future Electron bump cannot silently drop
# required libraries.
deb:
  packageName: cadencr
  artifactName: Cadencr-${version}-${arch}.${ext}
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libdrm2
    - libgbm1
    - libxkbcommon0
    # Runtime tools the service shells out to: worktrees/diffs and the ports scan.
    - git
    - lsof
  priority: optional
rpm:
  packageName: cadencr
  artifactName: Cadencr-${version}-${arch}.${ext}
  depends:
    - gtk3
    - libXScrnSaver
    - libXtst
    - libnotify
    - nss
    - xdg-utils
    - at-spi2-atk
    - libdrm
    - mesa-libgbm
    - libxkbcommon
    - git
    - lsof

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  sign: true
