[package]
name = "opencode-sdk-rs"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
async-trait = "0.1"
cli-discovery = { path = "../cli-discovery" }
dirs = "6"
futures-util = "0.3"
once_cell = "1"
regex-lite = "0.1"
reqwest = { version = "0.12", features = ["json"] }
reqwest-eventsource = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "sync", "time", "rt", "macros", "io-util"] }
tracing = "0.1"

[dev-dependencies]
axum = { version = "0.8", features = ["macros"] }
tempfile = "3"
tokio-stream = "0.1"

[lints]
workspace = true
