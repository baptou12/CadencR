[advisories]
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is pulled in by utoipa-axum 0.2; no fixed utoipa-axum release is available and this is an unmaintained warning, not a known exploitable vulnerability." },
]

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
