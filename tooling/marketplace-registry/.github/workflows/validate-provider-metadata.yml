name: Validate provider contribution

on:
  pull_request:

permissions:
  contents: read

jobs:
  inert-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Validation code must come from the reviewed base revision, never from the
      # contribution. This workflow therefore needs to exist on the default
      # branch before it can validate the first contribution.
      - name: Check out trusted registry tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-registry
          persist-credentials: false
      - name: Check out candidate registry metadata
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate-registry
          persist-credentials: false
      - name: Validate inert contribution metadata
        run: >-
          sh trusted-registry/scripts/ci/validate-provider-contribution.sh
          trusted-registry/ci/released-cli.env
          trusted-registry
          candidate-registry
          validate
      # Do not download or execute contributor archives here. Publisher identity,
      # source provenance, and publication authority require maintainer review and
      # protected publication-time revalidation; this unprivileged PR job proves
      # only the structural and immutable-history contribution policy.

  contributor-tooling:
    # Trusted base tooling treats the candidate as inert metadata only.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted registry tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-registry
          persist-credentials: false
      - name: Check out candidate registry metadata
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate-registry
          persist-credentials: false
      - name: Validate and build unsigned index with the pinned released CLI
        run: >-
          sh trusted-registry/scripts/ci/validate-provider-contribution.sh
          trusted-registry/ci/released-cli.env
          trusted-registry
          candidate-registry
          tooling
      # Neither job establishes publisher identity, provenance, or publication
      # authority, and neither may download or execute package archives.
