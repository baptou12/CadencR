name: Prepare protected publication input

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-payload:
    # Configure this environment with required reviewers in the registry repo.
    environment: protected-marketplace-publisher
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: npm test
      - run: npm run validate
      - name: Choose bounded publication window
        run: |
          echo "GENERATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "EXPIRES_AT=$(date -u -d '+7 days' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - run: npm run build:index -- --generated-at "$GENERATED_AT" --expires-at "$EXPIRES_AT" --output "$RUNNER_TEMP/managed-index.json"
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-unsigned-managed-index
          path: ${{ runner.temp }}/managed-index.json
          if-no-files-found: error
          retention-days: 1
      # This bootstrap intentionally stops before signing, mirroring, or release
      # writes. A production publisher must revalidate reviewed digests, mirror
      # exact bytes, sign only this canonical payload, and publish atomically.
      # It must never execute contributor archives or receive PR-controlled code.
