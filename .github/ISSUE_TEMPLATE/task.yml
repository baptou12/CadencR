name: Internal task
description: Track maintenance, refactoring, CI, docs, or other non-feature work.
title: "[task] "
labels:
  - Planned
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What needs to change, and why?
      placeholder: We should...
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Task type
      options:
        - Chore / maintenance
        - Refactor
        - Documentation
        - Tests
        - CI / release
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Desktop frontend
        - Backend service
        - Provider integration
        - Database / migration
        - API surface
        - Docs
        - CI / release
        - Not sure
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in scope and out of scope?
      placeholder: |
        In scope:
        - ...

        Out of scope:
        - ...

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Links, references, constraints, or implementation notes.
