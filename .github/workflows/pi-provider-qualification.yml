name: Qualify Pi provider on native platforms

# Manual only. Packs the Pi connector once per prepared target with the pinned
# released CLI, then runs the native loopback qualification (extracted archive +
# actual Pi 0.85.1 against an owned 127.0.0.1 model fixture) on a runner of EACH
# target's own OS and architecture. No credentials, no personal Pi configuration,
# no paid model, no publication: evidence JSON artifacts only. A target is added to
# the Pi package template only after its job here passes (see
# docs/qa/MARKETPLACE_PI_PLATFORMS_2026_10_25.md).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-provider-qualification
  cancel-in-progress: false

env:
  PI_VERSION: 0.85.1

jobs:
  package:
    name: Pack canonical candidate archives
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # actions/setup-node@v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc

      - name: Fetch the pinned released CLI
        run: |
          sh tooling/marketplace-registry/scripts/ci/fetch-released-cli.sh \
            scripts/cli-qualification.env "$RUNNER_TEMP/pi-cli"

      - name: Prepare one candidate archive per prepared target
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -eu
          cli="$RUNNER_TEMP/pi-cli/cadencr"
          cli_sha256=$(sha256sum "$cli" | cut -d ' ' -f 1)
          mkdir "$RUNNER_TEMP/pi-inputs" "$RUNNER_TEMP/pi-candidates" "$RUNNER_TEMP/pi-handoff"
          for target in darwin-aarch64 darwin-x86_64 linux-aarch64 linux-x86_64; do
            node plugins/providers/pi/scripts/qualification-input.mjs \
              --target "$target" --output "$RUNNER_TEMP/pi-inputs/$target.json"
            node plugins/providers/pi/scripts/prepare-candidate.mjs \
              --source-commit "$SOURCE_COMMIT" --candidate-target "$target" \
              --runtime external-node-pi --package "$RUNNER_TEMP/pi-inputs/$target.json" \
              --cli "$cli" --cli-sha256 "$cli_sha256" \
              --directory "$RUNNER_TEMP/pi-candidates/$target" > /dev/null
            mkdir "$RUNNER_TEMP/pi-handoff/$target"
            # The archive name is the preparer's own, taken from its receipt.
            archive=$(node -p 'require(process.argv[1]).archive.name' \
              "$RUNNER_TEMP/pi-candidates/$target/candidate.json")
            cp "$RUNNER_TEMP/pi-candidates/$target/$archive" \
              "$RUNNER_TEMP/pi-candidates/$target/candidate.json" "$RUNNER_TEMP/pi-handoff/$target/"
          done
          # The connector is a target-independent JavaScript payload.
          sha256sum "$RUNNER_TEMP"/pi-handoff/*/*.tar.gz | tee -a "$GITHUB_STEP_SUMMARY"
          test "$(sha256sum "$RUNNER_TEMP"/pi-handoff/*/*.tar.gz | cut -d ' ' -f 1 | sort -u | wc -l)" -eq 1

      # actions/upload-artifact@v7.0.2 — archives and receipts only. The name has no
      # run_attempt: re-running only the failed qualify jobs (the package job is not
      # repeated) must still find this run's handoff; a full re-run replaces it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pi-candidates-${{ github.run_id }}
          path: ${{ runner.temp }}/pi-handoff/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  qualify:
    name: Native loopback on ${{ matrix.target }}
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
          - target: darwin-x86_64
            runner: macos-15-intel
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # actions/setup-node@v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc

      # actions/download-artifact@v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: pi-candidates-${{ github.run_id }}
          path: ${{ runner.temp }}/pi-handoff

      - name: Install the pinned Pi CLI without lifecycle scripts
        run: |
          npm install --prefix "$RUNNER_TEMP/pi-install" --ignore-scripts --no-audit --no-fund \
            "@earendil-works/pi-coding-agent@$PI_VERSION"

      - name: Run native loopback qualification
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          handoff="$RUNNER_TEMP/pi-handoff/$TARGET"
          expected=$(node -p 'require(process.argv[1]).archive.sha256' "$handoff/candidate.json")
          archive=$(node -p 'require(process.argv[1]).archive.name' "$handoff/candidate.json")
          mkdir "$RUNNER_TEMP/pi-evidence"
          node plugins/providers/pi/scripts/qualify-native.mjs \
            --target "$TARGET" --archive "$handoff/$archive" \
            --expect-archive-sha256 "$expected" \
            --pi "$RUNNER_TEMP/pi-install/node_modules/.bin/pi" \
            --environment hosted --evidence "$RUNNER_TEMP/pi-evidence/evidence-$TARGET.json"

      - name: Summarize evidence
        if: ${{ always() }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          file="$RUNNER_TEMP/pi-evidence/evidence-$TARGET.json"
          if [ -f "$file" ]; then
            node -e 'const e=JSON.parse(require("fs").readFileSync(process.argv[1]));console.log(`- ${e.target}: **${e.result}** (${e.host.platform}/${e.host.arch}, node ${e.runtime.node}, pi ${e.runtime.pi}, archive ${e.archive.sha256})`)' "$file" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- $TARGET: no evidence produced" >> "$GITHUB_STEP_SUMMARY"
          fi

      # actions/upload-artifact@v7.0.2
      - if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pi-qualification-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pi-evidence/evidence-${{ matrix.target }}.json
          if-no-files-found: warn
          retention-days: 30
