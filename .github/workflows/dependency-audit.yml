name: Dependency audit

on:
  pull_request:
  push:
    branches:
      - main
      - "v*"
    tags:
      - "v*"
  schedule:
    # Catch advisories published after a dependency was merged.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pnpm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Enable pnpm from packageManager
        run: corepack enable

      # actions/setup-node@v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Audit all production and development dependencies
        run: pnpm audit --audit-level=low
