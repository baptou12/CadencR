[workspace]
members = [
    "packages/service",
    "packages/claude-agent-sdk-rs",
    "packages/cli-discovery",
    "packages/codex-app-server-sdk-rs",
    "packages/opencode-sdk-rs",
    "packages/loc",
    "packages/tauri/src-tauri",
]
resolver = "2"

[workspace.package]
license = "Apache-2.0"

[workspace.lints.rust]
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"
