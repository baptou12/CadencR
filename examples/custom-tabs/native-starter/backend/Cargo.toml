[package]
name = "native-starter"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Native backend of the Native starter custom tab"

# Its own workspace: the tab builds on its own, in or out of the Cadencr
# checkout.
[workspace]

[dependencies]
cadencr-tab-backend = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
cadencr-tab-backend = { version = "0.1", features = ["conformance"] }
